schema_version: 1

context:
  name: smallworld-api
  version: "1.1.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/smallworld-api-${{ version }}.tar.gz
  sha256: 2d01d5b6d1441ded4daf6631592c3bfcc7bf7c0307ccd2417d1e9cf00ee8ae9b

build:
  number: 3
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pandas
    - requests
    - ipython

tests:
  - python:
      imports:
        - smallworld_api
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: An (unofficial) Python3 module to query the SmallWorld chemical space search server (https://sw.docking.org/search.html)
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/matteoferla/Python_SmallWorld_API

extra:
  recipe-maintainers:
    - jan-janssen
